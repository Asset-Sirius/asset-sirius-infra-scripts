AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Stack to allocate Elastic IPs for Node.js, Grafana and the second frontend
  instance. This template only allocates the EIPs (Domain: vpc) and exports
  their AllocationIds and Public IPs. Associations to instances are handled by
  the compute stack using the AllocationIds.

Resources:
  NodeJsEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: asset-sirius-eip-nodejs

  GrafanaEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: asset-sirius-eip-grafana

  Frontend2Eip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: asset-sirius-eip-frontend-2

Outputs:
  NodeEipAllocationId:
    Description: "AllocationId do EIP reservado para Node.js (ex: eipalloc-01234567)"
    Value: !GetAtt NodeJsEip.AllocationId

  NodeEipPublicIp:
    Description: Public IP do EIP reservado para Node.js
    Value: !Ref NodeJsEip

  GrafanaEipAllocationId:
    Description: "AllocationId do EIP reservado para Grafana (ex: eipalloc-89abcdef)"
    Value: !GetAtt GrafanaEip.AllocationId

  GrafanaEipPublicIp:
    Description: Public IP do EIP reservado para Grafana
    Value: !Ref GrafanaEip

  Frontend2EipAllocationId:
    Description: "AllocationId do EIP reservado para a 2a instância do frontend"
    Value: !GetAtt Frontend2Eip.AllocationId

  Frontend2EipPublicIp:
    Description: Public IP do EIP reservado para a 2a instância do frontend
    Value: !Ref Frontend2Eip

AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Compute stack - EC2 para aplicação Node.js e Grafana.

Parameters:
  NodeJsSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet (ID) onde a EC2 Node.js será criada

  GrafanaSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet (ID) onde a EC2 Grafana será criada

  NodeJsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security Group da EC2 Node.js (stack security)

  GrafanaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security Group da EC2 Grafana (stack security)

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: >-
      Nome do Key Pair EC2 (chave .pem já existente na conta).
      CloudFormation não entrega o arquivo .pem, apenas associa a chave existente.

  InstanceType:
    Type: String
    Default: t2.micro
    Description: Tipo das instâncias EC2 (padrão t2.micro)

  UbuntuAmiId:
    Type: String
    Default: ami-0ec10929233384c7f
    Description: >-
      ID da AMI Ubuntu Server (ex. 22.04 LTS) usada por ambas as EC2.

  Ec2IamRoleArn:
    Type: String
    Default: arn:aws:iam::852131219041:role/LabRole
    Description: ARN do IAM Role padrão anexado às EC2 via Instance Profile

Resources:
  Ec2DefaultInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Select [1, !Split ['/', !Ref Ec2IamRoleArn]]

  # ---------------------------
  # EC2 - Node.js
  # ---------------------------

  NodeJsEc2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref UbuntuAmiId
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref Ec2DefaultInstanceProfile
      SubnetId: !Ref NodeJsSubnetId
      SecurityGroupIds:
        - !Ref NodeJsSecurityGroupId
      Tags:
        - Key: Name
          Value: asset-sirius-ec2-nodejs
      # Script de startup (UserData) - inicia o container backend em Docker
      UserData: !Base64 |
        #!/bin/bash
        set -e
        apt-get update -y
        apt-get install -y docker.io
        systemctl enable --now docker

        # Pull and run backend container (assume app listens on 8080)
        docker pull lucsss487474/asset-sirius-images:backend || true
        if docker ps -a --format '{{.Names}}' | grep -q '^asset-sirius-backend$'; then
          docker rm -f asset-sirius-backend || true
        fi
        docker run -d --name asset-sirius-backend --restart=always -p 8080:8080 lucsss487474/asset-sirius-images:backend

  # ---------------------------
  # EC2 - Grafana
  # ---------------------------

  GrafanaEc2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref UbuntuAmiId
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref Ec2DefaultInstanceProfile
      SubnetId: !Ref GrafanaSubnetId
      SecurityGroupIds:
        - !Ref GrafanaSecurityGroupId
      Tags:
        - Key: Name
          Value: asset-sirius-ec2-grafana
      # Script de startup (UserData) - instalação básica do Grafana em Ubuntu
      UserData: !Base64 |
        #!/bin/bash
        set -e
        apt-get update -y
        apt-get install -y apt-transport-https ca-certificates curl jq

        # Install Docker
        apt-get install -y docker.io
        systemctl enable --now docker

        # Install docker-compose (standalone binary) - use latest release to match docker API
        DOCKER_COMPOSE=/usr/local/bin/docker-compose
        if [ ! -f "$DOCKER_COMPOSE" ]; then
          curl -fSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" -o $DOCKER_COMPOSE
          chmod +x $DOCKER_COMPOSE
        fi

        # Prepare mount point for persistent Grafana data
        mkdir -p /mnt/grafana-data

        # Try to detect the attached EBS device (/dev/xvdh by convention). If not present, wait briefly.
        DEVICE=/dev/xvdh
        for i in {1..20}; do
          if [ -b "$DEVICE" ]; then
            break
          fi
          sleep 3
        done

        # Fallback: try NVMe detection (for Nitro instances)
        if [ ! -b "$DEVICE" ]; then
          NVME_DEV=$(ls /dev/nvme*n1 2>/dev/null | head -n1 || true)
          if [ -n "$NVME_DEV" ]; then
            DEVICE=$NVME_DEV
          fi
        fi

        # If device exists and has no filesystem, create one and mount it
        if [ -b "$DEVICE" ]; then
          if ! blkid $DEVICE >/dev/null 2>&1; then
            mkfs.ext4 -F $DEVICE
          fi
          # Ensure fstab entry by UUID so mount survives reboots
          UUID=$(blkid -s UUID -o value $DEVICE)
          if ! grep -q "$UUID" /etc/fstab 2>/dev/null; then
            echo "UUID=$UUID /mnt/grafana-data ext4 defaults,nofail 0 2" >> /etc/fstab
          fi
          mount -a || true
        fi

        # Create compose file for Grafana + frontend
        cat > /opt/grafana-compose.yml <<'EOF'
        version: '3.8'
        services:
          grafana:
            image: grafana/grafana:latest
            container_name: grafana
            ports:
              - "3000:3000"
            environment:
              - GF_SECURITY_ALLOW_EMBEDDING=true
              - GF_SECURITY_COOKIE_SECURE=false
              - GF_SECURITY_COOKIE_SAMESITE=lax
              - GF_AUTH_ANONYMOUS_ENABLED=true
              - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
              - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
              - GF_INSTALL_PLUGINS=grafana-athena-datasource
            volumes:
              - /mnt/grafana-data:/var/lib/grafana
            restart: always

          frontend:
            image: lucsss487474/asset-sirius-images:frontend
            container_name: asset-sirius-frontend
            ports:
              - "80:80"
            restart: always

        
        EOF

        # Ensure Grafana data dir ownership (Grafana runs as UID 472) and start the compose stack
        chown -R 472:472 /mnt/grafana-data
        /usr/local/bin/docker-compose -f /opt/grafana-compose.yml up -d

        # Note: Athena plugin requires AWS credentials. Prefer an IAM Role attached to the EC2 instance (Instance Profile).

  # EBS volume for Grafana data (persist /var/lib/grafana via bind-mount)
  GrafanaEbsVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !GetAtt GrafanaEc2Instance.AvailabilityZone
      Size: 10
      Tags:
        - Key: Name
          Value: asset-sirius-grafana-data

  GrafanaVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref GrafanaEc2Instance
      VolumeId: !Ref GrafanaEbsVolume
      Device: /dev/xvdh

Outputs:
  NodeJsEc2InstanceId:
    Description: ID da instância EC2 Node.js
    Value: !Ref NodeJsEc2Instance

  GrafanaEc2InstanceId:
    Description: ID da instância EC2 Grafana
    Value: !Ref GrafanaEc2Instance


AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudFormation template to create an S3 bucket (asset-sirius-infra) and
  a Lambda function (asset-sirius-infra). The template assumes you will
  upload the function ZIP to the bucket (S3Key). Use CreateLambda=false
  to create only the bucket first, upload the artifact, then set
  CreateLambda=true to create the Lambda.

Parameters:
  RoleName:
    Type: String
    Default: LabRole
    Description: Name of an existing IAM role to use for the Lambda (must exist)

  S3Key:
    Type: String
    Default: placeholder/asset.zip
    Description: S3 key for the Lambda deployment package (upload this to the bucket before creating the Lambda)

  CreateLambda:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: When false the stack will only create the S3 bucket. Set to true to create the Lambda.

Conditions:
  CreateLambdaCondition: !Equals [ !Ref CreateLambda, "true" ]

Resources:
  AssetS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: asset-sirius-infra

  AssetSiriusInfraLambda:
    Type: AWS::Lambda::Function
    Condition: CreateLambdaCondition
    Properties:
      FunctionName: asset-sirius-infra
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${RoleName}
      Code:
        S3Bucket: !Ref AssetS3Bucket
        S3Key: !Ref S3Key
      Timeout: 900
      MemorySize: 10240

Outputs:
  BucketName:
    Description: S3 bucket name
    Value: !Ref AssetS3Bucket

  LambdaFunctionName:
    Description: Lambda function name (will exist only if CreateLambda=true)
    Value: !If [ CreateLambdaCondition, !Ref AssetSiriusInfraLambda, "" ]

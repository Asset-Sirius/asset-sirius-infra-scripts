AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudFormation template to create an S3 bucket (asset-sirius-infra) and
  a Lambda function (asset-sirius-infra). The template assumes you will
  upload the function ZIP to the bucket (S3Key). Use CreateLambda=false
  to create only the bucket first, upload the artifact, then set
  CreateLambda=true to create the Lambda.

Parameters:
  RoleName:
    Type: String
    Default: LabRole
    Description: Name of an existing IAM role to use for the Lambda (must exist)

Resources:
  AssetS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: asset-sirius-infra

  AssetSiriusInfraLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: asset-sirius-infra
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${RoleName}
      Code:
        ZipFile: |
          # Placeholder Lambda handler created by CloudFormation.\n          # Replace the function code using AWS Console, CLI, SDK or your n8n workflow when ready.
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder"}
      Timeout: 900
      MemorySize: 10240

Outputs:
  BucketName:
    Description: S3 bucket name
    Value: !Ref AssetS3Bucket

  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref AssetSiriusInfraLambda

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt AssetSiriusInfraLambda.Arn
